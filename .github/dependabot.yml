          - "*"
  - package-ecosystem: "npm"
    directory: "/ivette_second_brain_mvp/packages/gemini-adapter"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"
